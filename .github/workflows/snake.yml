name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Runs automatically every day at midnight UTC
  workflow_dispatch:      # Allows you to manually run the action from the GitHub Actions tab
  push:
    branches:
      - main              # Runs the action every time you push code to the 'main' branch

jobs:
  generate:
    permissions:
      contents: write     # Grants permission to write to your repository
    runs-on: ubuntu-latest
    timeout-minutes: 5    # Stops the action if it takes longer than 5 minutes

    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
